<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Temporarily Unavailable</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f1;
    --ink: #20242a;
    --muted: #59616c;
    --line: #d9d5ca;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  main {
    width: min(100%, 640px);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 40px 0;
    text-align: center;
  }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(28px, 6vw, 42px);
    line-height: 1.15;
    font-weight: 650;
    letter-spacing: 0;
  }

  p {
    margin: 0;
    font-size: 16px;
    line-height: 1.7;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main>
    <h1>Temporarily unavailable</h1>
    <p>This project page has been taken offline while updates are being prepared.</p>
  </main>
</body>
</html>
